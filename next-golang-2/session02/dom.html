<body>
    <h1> Selamat Datang : </h1>

    <p> Silahkan masukkan nama anda </p>

    <form>
        <div>
            <label> Name </label>
            <input type="text" value="dimas" name="name" id="name" onchange="handleChangeName()" />

    <p> Thanks </p>

        // DOM ( Document Object Model )

        console.log(document.getElementsByTagName("p"))

        const thanks = document.getElementsByTagName("p")[1]
        console.log(thanks.innerHTML)
        thanks.innerHTML = "<b> Terima kasih </b>"

        // sayHello()

        function handleSubmit() {
            alert("test")

            let salary = document.getElementsByName("salary")
