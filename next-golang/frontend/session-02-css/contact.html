<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        main {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: auto 1fr auto;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            gap: 16px;
            min-height: 100vh;
        }

        nav {
            grid-area: header;
            background-color: #333;
            color: white;
            padding: 16px 32px;
            text-align: center;
        }

        .menu {
            display: flex;
            gap: 24px;
            list-style: none;

        }

        .menu li a {
            text-decoration: none;
            color: white;
        }


        .left-sidebar {
            grid-area: sidebar;
            background-color: red;
            border: 1px solid black;
            text-align: center;
            font-size: 20px;
        }

        .main-content {
            grid-area: main;
            background-color: green;
            border: 1px solid black;
            text-align: center;
            font-size: 20px;
        }

        footer {
            grid-area: footer;
            background-color: #333;
            color: white;
            padding: 16px 32px;
            text-align: center;
        }
    </style>
</head>

<body>
    <main>
        <nav class="navbar">
            <div class="logo"> ADY </div>
            <ul class="menu">
                <li><a href="./index.html"> Home </a></li>
                <li><a href="./service.html">Service </a></li>
            </ul>
        </nav>

        <div class="left-sidebar">
            <h1>Left Sidebar</h1>
        </div>
        <div class="main-content">
            <h1>Main Content</h1>
        </div>
        <footer class="footer">
            <h1>Footer</h1>
        </footer>
    </main>
</body>

</html>
