<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            color: white;
            /* yang di warnai adalah content atau tulisan*/
            padding: 16px 32px;
            /* padding: 10px 10px; */
            /* kiri: atas-bawah, kanan: kiri-kanan */
            /* padding: 10px 10px 10px 10px; */
            /* kiri: atas, kanan, bawah, kiri */
        }

        .menu {
            display: flex;
            gap: 24px;
            list-style: none;

        }

        .menu li a {
            text-decoration: none;
            color: white;
        }

        .main-container {
            display: flex;

            flex-direction: row;
            align-items: start;
            justify-content: space-evenly;
            flex-wrap: wrap;
            gap: 20px;
            height: 500px;
        }

        .left-sidebar {
            background-color: red;
            border: 1px solid black;

            text-align: center;
            font-size: 20px;
            flex: 1;
            height: 500px;
        }

        .main-content {

            background-color: green;
            border: 1px solid black;

            text-align: center;
            font-size: 20px;
            flex: 3;
            height: 500px;
        }

        .right-sidebar {

            background-color: blue;
            border: 1px solid black;

            text-align: center;
            font-size: 20px;
            flex: 1;
            height: 500px;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 16px 32px;
            text-align: center;
        }

        :root {
            --warna-utama: chocolate;
            --warna-bg: green;
            --warna-text: grey;
            --ukuran-besar: 24px;
            --radius: 8px;
        }

        .tombol {
            background-color: var(--warna-utama);
            color: var(--warna-text);
            font-size: var(--ukuran-besar);
            border-radius: var(--radius);
        }

        @media screen and (min-width: 0px) and (max-width: 320px) {
            .main-container {
                flex-direction: column;
                width: 100%;
            }

            .left-sidebar,
            .main-content {
                width: 100%;
                gap: 0;
            }

            .right-sidebar {
                display: none;
                /* visibility: hidden; */
            }
        }

        @media screen and (min-width: 321px) and (max-width: 600px) {
            .main-container {
                flex-direction: column;
                width: 100%;
            }

            .left-sidebar,
            .main-content,
            .right-sidebar {
                width: 100%;
                gap: 0;
            }
        }
    </style>
</head>

<body>


    <nav class="navbar">
        <div class="logo"> ADY </div>
        <ul class="menu">
            <li><a href="./index.html"> Home </a></li>
            <li><a href="./service.html">Service </a></li>
        </ul>
    </nav>

    <div class="main-container">
        <div class="left-sidebar"></div>
        <div class="main-content">
            <button class="tombol"> Tombol </button>
        </div>
        <div class="right-sidebar"></div>
    </div>
    <footer>
        <p>Copyright &copy; 2026 ADY</p>
    </footer>
</body>

</html>
