<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>

<body style="width: 80%; margin: 0 auto;">
    <header>
        <nav>
            <a href="index.html">Home</a> |
            <a href="contact.html">Contact</a> |
            <a href="profile.html">Profile</a> |
        </nav>
    </header>
    <hr>

    <main>
        <fieldset>
            <legend>Contact</legend>
            <form action="">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">
                </div>
                <br>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <br>
                <div>
                    <label for="city">City</label>
                    <select name="city" id="city">
                        <option value="">Select City</option>
                        <option value="jakarta">Jakarta</option>
                        <option value="bandung">Bandung</option>
                        <option value="surabaya">Surabaya</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="gender">Gender</label>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>
                <br>
                <br>
                <div>
                    <label for="religion">Religion</label>
                    <input type="radio" id="islam" name="religion" value="islam">
                    <label for="islam">Islam</label>
                    <input type="radio" id="kristen" name="religion" value="kristen">
                    <label for="kristen">Kristen</label>
                    <input type="radio" id="hindu" name="religion" value="hindu">
                    <label for="hindu">Hindu</label>
                    <input type="radio" id="budha" name="religion" value="budha">
                    <label for="budha">Budha</label>
                    <input type="radio" id="konghucu" name="religion" value="konghucu">
                    <label for="konghucu">Konghucu</label>
                </div>
                <br>
                <div>
                    <label for="hobbies">Hobbies</label>
                    <input type="checkbox" id="reading" name="hobbies" value="reading">
                    <label for="reading">Reading</label>
                    <input type="checkbox" id="coding" name="hobbies" value="coding">
                    <label for="coding">Coding</label>
                    <input type="checkbox" id="gaming" name="hobbies" value="gaming">
                    <label for="gaming">Gaming</label>
                    <input type="checkbox" id="swimming" name="hobbies" value="swimming">
                    <label for="swimming">Swimming</label>
                </div>
                <br>
                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" cols="30" rows="10" draggable="false"></textarea>
                </div>
                <br>
                <input type="submit" value="Send">
            </form>
        </fieldset>
    </main>
    <hr>
    <footer>
        <p style="text-align: center;"> Copyright &copy; 2026 Aries Dimas Yudhistira </p>
    </footer>
</body>

</html>
